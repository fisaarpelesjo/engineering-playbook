name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Controlled policy: GitHub-owned action pinned by major version for maintainability.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        # Controlled policy: ecosystem-standard action documented in THIRD_PARTY_NOTICES when vendored.
      - name: Sync
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Verify
        run: uv run python scripts/verify.py

