name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  delivery-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          # On a pull request GitHub checks out a synthetic merge commit whose
          # first parent is the base branch, so a state verified on the branch
          # reads as stale. Verify the commit the author actually pushed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Branch name
        run: uv run python scripts/delivery.py validate-ci --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
      - name: PR title
        if: github.event_name == 'pull_request'
        # The title is attacker-controlled text on a public repository: anyone can
        # open a pull request. Interpolating it straight into `run:` let that text
        # reach the shell, so it travels through `env:` and is quoted here instead.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/delivery.py validate-ci --pr-title "$PR_TITLE"
      - name: Closes issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: uv run python scripts/delivery.py validate-ci --pr-body "$PR_BODY"
      - name: Convergence
        run: uv run python scripts/verify.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          # On a pull request GitHub checks out a synthetic merge commit whose
          # first parent is the base branch, so a state verified on the branch
          # reads as stale. Verify the commit the author actually pushed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Sync
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Verify
        run: uv run python scripts/verify.py
