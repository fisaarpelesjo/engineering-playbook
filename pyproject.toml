[project]
name = "engineering-playbook"
version = "0.1.0"
description = "Reusable engineering playbook for agent-assisted portfolio projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "jsonschema>=4.23.0",
]

# `scripts/agent_watch/watch_grid.py` imports rich at runtime and exits with an install hint
# when it is absent. Issue #15: it was neither installed nor declared, so nothing failed if
# that import path rotted -- a rename in rich would have broken the grid view silently, with
# no gate anywhere noticing. Declared here as optional because the stream view needs none of
# it, and carried in the dev group below so the test suite can exercise the working path
# rather than only the refusal.
[project.optional-dependencies]
watch = [
  "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
engineering-playbook = "engineering_playbook.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff==0.16.6",
  "pyright==1.1.411",
  "rich>=13.7.0",
]

[tool.hatch.build]
include = [
  "src/engineering_playbook/**/*.py",
  "src/engineering_playbook/resources/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_playbook"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# W, N, A, C4 and RUF come from a project that ran this playbook for months.
# Adopting them here cost one finding, measured before the change.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
# An undeclared marker and a malformed config are silent losses of coverage,
# so each fails the run instead of passing with a warning nobody reads.
addopts = "-ra --strict-markers --strict-config"

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "scripts", "tests"]
# `scripts/agent_watch` is not installed, and its tests import it as a namespace package under
# `scripts/` -- which is NOT how its entry points import it: those insert their own directory
# and import the bare top-level `subagent_feed`. `extraPaths` exists so pyright resolves the
# spelling the tests use. `src` stays first for the reason below.
# `src` stays first so `engineering_playbook` keeps resolving from source: adding `scripts`
# alone made pyright resolve it from site-packages instead and report a missing stub file for
# every module of this repository's own package.
extraPaths = ["src", "scripts"]
typeCheckingMode = "strict"
