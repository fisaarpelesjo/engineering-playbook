[project]
name = "engineering-playbook"
version = "0.1.0"
description = "Reusable engineering playbook for agent-assisted portfolio projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
engineering-playbook = "engineering_playbook.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
]

[tool.hatch.build]
include = [
  "src/engineering_playbook/**/*.py",
  "src/engineering_playbook/resources/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_playbook"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "scripts", "tests"]
typeCheckingMode = "basic"
