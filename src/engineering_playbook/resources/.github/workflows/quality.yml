name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  delivery-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      # Required by "Specification claims this code": the `pulls/<n>/files` endpoint is not
      # covered by `contents: read`. Measured on run 35641532687, where the paginated list came
      # back empty and the step refused rather than reporting on nothing -- the right direction,
      # and a false red until this line existed.
      pull-requests: read
      # Read-only, and required only by the "Ruleset reconciliation" step below: comparing
      # .github/rulesets/main.yml against the ruleset applied on the server needs `gh api
      # repos/:owner/:repo/rulesets`, which the default contents:read token cannot read.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          # On a pull request GitHub checks out a synthetic merge commit whose
          # first parent is the base branch, so a state verified on the branch
          # reads as stale. Verify the commit the author actually pushed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Branch name
        run: uv run python scripts/delivery.py validate-ci --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
      - name: PR title
        if: github.event_name == 'pull_request'
        # The title is attacker-controlled text on a public repository: anyone can
        # open a pull request. Interpolating it straight into `run:` let that text
        # reach the shell, so it travels through `env:` and is quoted here instead.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/delivery.py validate-ci --pr-title "$PR_TITLE"
      - name: Closes issue
        if: github.event_name == 'pull_request'
        # The body is read live rather than from the event payload. `publish`
        # pushes the branch and only then writes the body, so the run triggered
        # by that push carries the body as it was BEFORE the card was written --
        # measured on run 35533986187, which refused a pull request whose body
        # already said `Closes #25`. An `edited` event does not retrigger the
        # workflow, so reading the payload loses the race by construction.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY="$(gh pr view "$PR_NUMBER" --json body --jq .body)"
          uv run python scripts/delivery.py validate-ci --pr-body "$PR_BODY"
      # FR-014 / AC-010: code that no specification claims does not reach main. The changed
      # paths come from the API rather than from `git diff`, because the checkout above is
      # `fetch-depth: 2` and does not reach the base of a branch with more than one commit --
      # measured, not assumed. Same shape as the "Closes issue" step: `gh` reads, the value
      # travels through `env`, and the rule lives in Python where it is testable.
      - name: Specification claims this code
        if: github.event_name == 'pull_request'
        # Paginated on purpose. `gh pr view --json files` caps at 100 paths and says nothing
        # about having cut: measured against a real pull request of 167 changed files, it
        # returned 100, unsorted. A gate reporting on a window it did not know it was looking
        # through is the silent-truncation defect, so the true count travels alongside and the
        # Python side refuses when the two disagree (NFR-002).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PR_FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].path')"
          PR_COUNT="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files')"
          uv run python scripts/delivery.py validate-ci --pr-files "$PR_FILES" --pr-file-count "$PR_COUNT"
      - name: Convergence
        run: uv run python scripts/verify.py
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          # On a pull request GitHub checks out a synthetic merge commit whose
          # first parent is the base branch, so a state verified on the branch
          # reads as stale. Verify the commit the author actually pushed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Sync
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run pyright
      - name: Tests
        run: uv run pytest
      - name: Verify
        run: uv run python scripts/verify.py
  attest:
    # THE JOB THAT HOLDS THE SIGNING IDENTITY RUNS NO CODE FROM THIS REPOSITORY.
    #
    # `id-token: write` puts ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN into
    # the environment of EVERY step of the job that declares it -- that is how the attest action
    # reaches the identity at all. Declaring it on the `quality` job would put that token, and a
    # `GITHUB_TOKEN` carrying `attestations: write`, in the same environment as `uv sync` (which
    # runs dependency build hooks) and `pytest` (which runs this repository's own test code). One
    # compromised dependency there could mint verdicts for content nobody measured. So the
    # identity lives in this job instead, whose only steps are a checkout, one `git rev-parse`
    # and the action itself.
    #
    # `needs:` is what makes the verdict mean anything: this job does not start until both
    # batteries have passed, so a signature exists only for content that was measured. There is
    # no `if: always()` and no `continue-on-error` anywhere above, so a failed check stops this.
    #
    # Only on `push`, and only on a public repository. A pull request from a fork never receives
    # `id-token: write` whatever this block says, and attestations require a public repository or
    # a plan that includes them. `attestation.repository_identity` asks GitHub the same visibility
    # question on the reading side, so a repository that cannot mint a verdict is never gated on
    # having one. `publish` pushes the branch before `merge` runs, so the branch tip a merge is
    # about always gets a push run of its own.
    runs-on: ubuntu-latest
    needs: [delivery-policy, quality]
    if: github.event_name == 'push' && github.event.repository.private == false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Content verdict subject
        # The subject format is written out in shell here, rather than by calling
        # `scripts/attest.py`, ON PURPOSE: that script needs the package installed, and
        # installing it would execute dependency build hooks in the one job that holds the
        # signing identity -- exactly what this job exists to avoid. The duplication is guarded:
        # `tests/unit/test_signed_verdict_leaves_the_tree.py` asserts these bytes are identical
        # to `attestation.subject_bytes`, so the two copies cannot drift unnoticed.
        #
        # The tree comes from the commit, on a fresh checkout where nothing has run, so the bytes
        # signed here name the content the batteries above measured.
        run: |
          tree="$(git rev-parse --verify HEAD^{tree})"
          printf 'engineering-playbook/content-verdict/v1\ntree %s\n' "$tree" > "$RUNNER_TEMP/content-verdict.txt"
      - name: Sign the content verdict
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/content-verdict.txt
