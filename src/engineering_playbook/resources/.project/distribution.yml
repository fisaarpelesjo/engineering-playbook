schema_version: "1.0.0"
description: "Manifest of files installed into derived projects."
include:
  files:
    - ".gitignore"
    - ".pre-commit-config.yaml"
    - "AGENTS.md"
    - "CHANGELOG.md"
    - "CLAUDE.md"
    - "CONTRIBUTING.md"
    - "ENGINEERING.md"
    - "GEMINI.md"
    - "LICENSE"
    - "MIGRATIONS.md"
    - "README.md"
    - "REVIEW.md"
    - "SECURITY.md"
    - "THIRD_PARTY_NOTICES.md"
    - "uv.lock"
    - ".github/copilot-instructions.md"
    - ".github/pull_request_template.md"
    - ".github/ISSUE_TEMPLATE/bug.yml"
    - ".github/ISSUE_TEMPLATE/feature.yml"
    - ".github/workflows/quality.yml"
    - ".github/rulesets/main.yml"
    - ".cursor/rules/engineering.mdc"
    - ".devin/rules/engineering.md"
  directories:
    - ".project/schemas"
    - "docs/agents"
    - "docs/context"
    - "docs/decisions"
    - "docs/requirements"
    - "docs/delivery"
    - "docs/standards"
    - "extensions"
    - "profiles"
    - "scripts"
    - "templates"
exclude:
  paths:
    - "bootstrap-engineering-template.yml"
    - "specs/001-engineering-playbook"
    - ".project/checkpoints"
    - ".project/state.yml"
    - ".project/workstreams"
    - ".project/distribution.yml"
    - "tests"
    - ".venv"
    - ".pytest_cache"
    - ".ruff_cache"
    - ".pyright"
generated:
  project: ".project/project.yml"
  state: ".project/state.yml"
  prd: "docs/requirements/project-requirements.md"
  lock: ".project/playbook.lock.yml"
  pyproject: "pyproject.toml"
empty_directories:
  - ".project/checkpoints"
  - ".project/workstreams"
  - ".project/local"
  - "specs"
